[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[[headers]]
  for = "/assets/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Legacy .html URLs → clean URLs.
# Netlify applies static files ahead of non-forced redirects, so these are
# shadowed while the old file still exists in public/ and activate the moment
# that file is removed.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301

[[redirects]]
  from = "/cashflow-index.html"
  to = "/cashflow-index"
